[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "novel-local"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.146.0", "starlette==1.9.0", "uvicorn==0.54.0", "pydantic==2.14.1",
  "ctranslate2==4.8.3", "sentencepiece==0.2.2", "tokenizers==0.21.1",
  "httpx==0.28.1", "pystray==0.19.5", "Pillow==13.0.0", "setuptools==84.0.0",
  "opencc-python-reimplemented==0.1.7"
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.11.9", "pyinstaller==6.13.0", "pip-audit==2.10.1"]

[tool.setuptools.packages.find]
include = ["local_service*"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]

[tool.ruff]
line-length = 110
